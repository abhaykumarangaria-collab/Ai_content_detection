{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>Create Account</h2>
    <p style="color: #94a3b8; margin-bottom: 30px;">Join to save your AI scan history</p>
    
    <form method="POST" action="{{ url_for('register') }}">
        <div style="margin-bottom: 20px; text-align: left;">
            <label style="display: block; margin-bottom: 8px;">Choose a Username</label>
            <input type="text" name="username" required 
                   style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); background: transparent; color: var(--text-color); box-sizing: border-box;">
        </div>
        
        <div style="margin-bottom: 30px; text-align: left;">
            <label style="display: block; margin-bottom: 8px;">Create a Password</label>
            <input type="password" name="password" required 
                   style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); background: transparent; color: var(--text-color); box-sizing: border-box;">
        </div>
        
        <button type="submit" class="btn btn-full">Register</button>
    </form>
    
    <p style="margin-top: 20px; font-size: 14px;">
        Already have an account? <a href="{{ url_for('login') }}" style="color: #00ffcc;">Login here</a>
    </p>
</div>
{% endblock %}
