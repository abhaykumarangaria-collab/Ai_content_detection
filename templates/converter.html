{% extends "base.html" %}

{% block content %}
<div class="card">
    <h1 style="color: #00ffcc;">Universal File Converter</h1>
    <p>Convert your documents between multiple formats securely.</p>
    
    <form id="convertForm">
        <div id="convDropArea" class="upload-box">
            <input type="file" id="convFileInput" name="convFile">
            <div id="convUploadText">
                📂 Drag & Drop File here <br><br> or <b>Click to Upload</b>
                <span style="font-size: 11px; opacity: 0.5; margin-top: 10px; display: block;">Formats: .pptx, .txt, .pdf</span>
            </div>
            <div id="convFilePreview" class="file-preview">
                <p id="convFileName" style="color: #00ffcc; font-weight: bold; word-break: break-all;"></p>
                <button type="button" id="convRemoveFile" class="remove-file">❌ Remove</button>
            </div>
        </div>
        
        <div style="margin: 15px 0; display: flex; justify-content: space-between; align-items: center;">
            <label>Convert to:</label>
            <select id="formatSelect" style="padding: 8px; border-radius: 5px; background: rgba(0,0,0,0.5); color: white; border: 1px solid #00ffcc; width: 60%; outline: none;">
                <option value="pdf">PDF (.pdf)</option>
                <option value="txt">Text (.txt)</option>
                <option value="pptx">PowerPoint (.pptx)</option>
            </select>
        </div>
        
        <button type="button" class="btn btn-full" id="convertBtn" disabled>🔄 Convert File</button>
        <div style="font-size: 11px; opacity: 0.6; margin-top: 15px;">🔒 Stateless Conversion. No files are stored.</div>
    </form>
</div>

<script>
    const dropArea = document.getElementById("convDropArea");
    const fileInput = document.getElementById("convFileInput");
    const filePreview = document.getElementById("convFilePreview");
    const fileName = document.getElementById("convFileName");
    const removeBtn = document.getElementById("convRemoveFile");
    const btn = document.getElementById("convertBtn");
    const uploadText = document.getElementById("convUploadText");

    dropArea.onclick = () => fileInput.click();
    ["dragenter", "dragover"].forEach(evt => dropArea.addEventListener(evt, e => { e.preventDefault(); dropArea.classList.add("dragover"); }));
    ["dragleave", "drop"].forEach(evt => dropArea.addEventListener(evt, e => { e.preventDefault(); dropArea.classList.remove("dragover"); }));
    dropArea.ondrop = e => handleFile(e.dataTransfer.files[0]);
    fileInput.onchange = () => handleFile(fileInput.files[0]);

    removeBtn.onclick = (e) => { e.stopPropagation(); fileInput.value = ""; filePreview.style.display = "none"; uploadText.style.display = "block"; btn.disabled = true; };

    function handleFile(file) {
        if (!file) return;
        const dt = new DataTransfer(); dt.items.add(file); fileInput.files = dt.files;
        uploadText.style.display = "none"; filePreview.style.display = "block";
        fileName.innerText = "📄 " + file.name;
        btn.disabled = false;
    }

    btn.onclick = async (e) => {
        e.preventDefault();
        const file = fileInput.files[0];
        const format = document.getElementById("formatSelect").value;
        if (!file) return;
        
        let type = file.name.endsWith(".pptx") ? (format === "pdf" ? "ppt-pdf" : "ppt-text") : (file.name.endsWith(".txt") ? "text-ppt" : "");
        if (!type) return alert("Unsupported conversion format.");
        
        const formData = new FormData(); formData.append("file", file); formData.append("type", type);
        btn.innerText = "⏳ Converting..."; btn.disabled = true;

        try {
            const response = await fetch("/api/convert", { method: "POST", body: formData });
            const data = await response.json();
            if (data.status === "success" && data.file_b64) {
                const byteChars = atob(data.file_b64), byteNums = new Array(byteChars.length);
                for (let i=0; i<byteChars.length; i++) byteNums[i] = byteChars.charCodeAt(i);
                const blob = new Blob([new Uint8Array(byteNums)], { type: data.mime_type });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = file.name.split('.')[0] + "_converted" + data.extension; a.click(); 
                window.URL.revokeObjectURL(url);
                alert("✅ Download started.");
            } else alert("❌ Error: " + data.error);
        } catch (err) { alert("❌ Server Error."); } finally { btn.innerText = "🔄 Convert File"; btn.disabled = false; }
    };
</script>
{% endblock %}
